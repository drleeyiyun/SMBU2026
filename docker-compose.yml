services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus
    volumes:
      - campus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Host access for local `pnpm db:migrate` / GUI clients. Change if 5433 is taken.
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/campus
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  campus_pg_data:
